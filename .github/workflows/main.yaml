name: Main workflow
on: push
jobs:
  Build-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Clone down repository
        uses: actions/checkout@v4

      - name: Set up go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: ./frontend/go.mod

      - name: Install go dependencies
        working-directory: ./frontend
        run: go mod download
      
      - name: Build application
        working-directory: ./frontend
        run: go build
      
      - name: Test application
        working-directory: ./frontend
        run: go test -v ./...

      - name: Upload repo
        uses: actions/upload-artifact@v4
        with: 
          name: code
          path: .
          include-hidden-files: true

  Build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Clone down repository
        uses: actions/checkout@v4

      - name: Set up go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: ./backend/go.mod

      - name: Install go dependencies
        working-directory: ./backend
        run: go mod download
      
      - name: Build application
        working-directory: ./backend
        run: go build
      
      - name: Test application
        working-directory: ./backend
        run: go test -v ./...

  Smoke-test:
    runs-on: ubuntu-latest
    needs: [Build-and-test-frontend, Build-and-test-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t myapp:ci ./frontend

      - name: Deploy test version
        run: docker run -d --name myapp-ci -p 8080:8080 myapp:ci

      - name: Run smoke test
        run: ./scripts/smoke-test.sh http://localhost:8080/healthz

      - name: Logs on failure
        if: failure()
        run: docker logs myapp-ci

      - name: Tear down
        if: always()
        run: docker rm -f myapp-ci

  Build-docker-images:
    runs-on: ubuntu-latest
    needs: [Build-and-test-frontend, Build-and-test-backend, Smoke-test]
    permissions:               
      contents: read
      packages: write
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .              

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:                  
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:                  
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
