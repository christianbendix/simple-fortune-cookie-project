apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/christianbendix/simple-fortune-cookie-project/frontend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fortune-config